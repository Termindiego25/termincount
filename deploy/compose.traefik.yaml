name: termincount

services:
  termincount_db:
    image: postgres:18-alpine
    restart: unless-stopped
    env_file:
      - postgresql.env
    environment:
      POSTGRES_DB_FILE: /run/secrets/db_database
      POSTGRES_USER_FILE: /run/secrets/db_username
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_database
      - db_username
      - db_password
    volumes:
      - ./data/postgres:/var/lib/postgresql
    networks:
      - database
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$(cat /run/secrets/db_username)\" -d \"$$(cat /run/secrets/db_database)\""]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  termincount:
    image: termindiego25/termincount:${TERMINCOUNT_VERSION:-1.3.1}
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 35s
    env_file:
      - termincount.env
    depends_on:
      termincount_db:
        condition: service_healthy
    environment:
      DB_HOST: termincount_db
      DB_PORT: 5432
      DB_NAME_FILE: /run/secrets/db_database
      DB_USER_FILE: /run/secrets/db_username
      DB_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_database
      - db_username
      - db_password
    networks:
      database: {}
      proxy:
        aliases:
          - termincount
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

secrets:
  db_database:
    file: secrets/credentials/db_database.txt
  db_username:
    file: secrets/credentials/db_username.txt
  db_password:
    file: secrets/credentials/db_password.txt

networks:
  database:
    internal: true
  proxy:
    name: termincount_net
    external: true
