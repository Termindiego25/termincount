name: Checks
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: termincount
          POSTGRES_PASSWORD: termincount
          POSTGRES_DB: termincount
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U termincount -d termincount"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          cache: npm
      - run: npm install --global npm@12.2.1
      - run: npm ci --prefix tools/npm-bundle --install-strategy=nested --ignore-scripts
      - run: node tools/npm-bundle/apply.mjs "$(npm root -g)/npm"
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium webkit
      - run: npm audit --audit-level=moderate
      - run: npm audit --prefix tools/npm-bundle --audit-level=moderate
      - name: Verify the patched native build toolchain
        run: docker build --pull --target build-tool-test .
      - name: Verify the database image and startup contract
        run: |
          docker build --pull -f deploy/postgres/Dockerfile -t termincount-postgres:ci .
          node tools/check-database-migration.mjs termincount-postgres:ci termindiego25/termincount@sha256:814eace5a51f5c310ad809060b7596d24017b5b81c3f0d9429d06cd0382bd3e5
      - name: Build and check the actual container runtime
        run: |
          docker build --pull -t termincount:ci .
          docker run -d --name termincount-ci --network host --read-only \
            --cap-drop ALL --security-opt no-new-privileges:true \
            -e DATABASE_URL=postgres://termincount:termincount@127.0.0.1:5432/termincount \
            -e ORIGIN=http://localhost:3000 termincount:ci
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://localhost:3000/healthz >/dev/null; then
              docker exec termincount-ci node --version
              node tools/check-container-shutdown.mjs termincount-ci http://localhost:3000
              exit 0
            fi
            sleep 2
          done
          docker logs termincount-ci
          exit 1
