name: termincount

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    env_file:
      - postgresql.env
    secrets:
      - db_database
      - db_username
      - db_password
    volumes:
      - ./data/postgres:/var/lib/postgresql
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$(cat /run/secrets/db_username)\" -d \"$$(cat /run/secrets/db_database)\""]
      interval: 10s
      timeout: 5s
      retries: 5

  termincount:
    image: termindiego25/termincount:${TERMINCOUNT_VERSION:-1.3.1}
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 35s
    env_file:
      - termincount.env
    depends_on:
      db:
        condition: service_healthy
    secrets:
      - db_database
      - db_username
      - db_password
    ports:
      - "127.0.0.1:${TERMINCOUNT_PORT:-8080}:3000"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

secrets:
  db_database:
    file: secrets/credentials/db_database.txt
  db_username:
    file: secrets/credentials/db_username.txt
  db_password:
    file: secrets/credentials/db_password.txt

networks:
  default:
    name: termincount_net
