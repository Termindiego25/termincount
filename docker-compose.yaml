name: termincount

services:
  termincount_db:
    container_name: termincount_db
    image: termindiego25/termincount:postgres-18.6-1.5.1
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - FOWNER
      - DAC_OVERRIDE
      - SETUID
      - SETGID
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
      - /var/run/postgresql:uid=70,gid=70,mode=3775
    env_file:
      - postgresql.env
    secrets:
      - db_database
      - db_username
      - db_password
    volumes:
      - ./data/postgres:/var/lib/postgresql
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$(cat /run/secrets/db_username)\" -d \"$$(cat /run/secrets/db_database)\""]
      interval: 10s
      timeout: 5s
      retries: 5

  termincount_app:
    container_name: termincount_app
    hostname: termincount
    image: termindiego25/termincount:${TERMINCOUNT_VERSION:-1.5.1}
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 35s
    env_file:
      - termincount.env
    depends_on:
      termincount_db:
        condition: service_healthy
    secrets:
      - db_database
      - db_username
      - db_password
    ports:
      - "127.0.0.1:${TERMINCOUNT_PORT:-8080}:3000"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

secrets:
  db_database:
    file: secrets/credentials/db_database.txt
  db_username:
    file: secrets/credentials/db_username.txt
  db_password:
    file: secrets/credentials/db_password.txt

networks:
  default:
    name: termincount_net
